<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/inc>
    Require all denied
</Directory>

<Directory /var/www/html/tools>
    Require all denied
</Directory>

<Directory /var/www/html/data>
    Require all denied
</Directory>

<FilesMatch "(^\.|\.(sqlite|sqlite3|db|log|ini|env|bak|sql)$)">
    Require all denied
</FilesMatch>
